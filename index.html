<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14151F">
<title>F_F's Honeymoon</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #ECEAF5;
    --paper: #14151F;
    --card: #1C1E2B;
    --blue: #7C93FF;
    --blue-tint: #232A45;
    --blue-tint-soft: #1B2036;
    --pink: #F281AC;
    --pink-tint: #2E2030;
    --pink-border: #C4527E;
    --line: #30324A;
    --muted: #9694AC;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { background: var(--paper); }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 16px;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px calc(60px + env(safe-area-inset-bottom));
  }

  header.hero {
    margin-bottom: 22px;
  }

  .eyebrow {
    font-size: 13px;
    color: var(--pink);
    font-weight: 500;
    margin: 0 0 4px;
  }

  .trip-name-input {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    color: var(--ink);
    border: none;
    background: transparent;
    padding: 4px 0;
    width: 100%;
    outline: none;
    border-bottom: 1px solid transparent;
  }
  .trip-name-input:focus {
    border-bottom: 1px solid var(--blue);
  }

  .trip-subtitle-input {
    font-size: 13px;
    color: var(--muted);
    margin: 6px 0 0;
    background: transparent;
    border: none;
    outline: none;
    padding: 4px 0;
    width: 100%;
    font-family: 'Inter', sans-serif;
    border-bottom: 1px solid transparent;
  }
  .trip-subtitle-input:focus {
    border-bottom: 1px solid var(--blue);
  }
  .trip-subtitle-input::placeholder { color: var(--muted); opacity: 0.7; }

  .category {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .category-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--blue-tint);
    padding: 14px 16px;
  }

  .cat-name-input {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--blue);
    background: transparent;
    border: none;
    outline: none;
    padding: 4px 0;
    width: 100%;
    margin-right: 8px;
  }

  .cat-remove {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 8px;
    flex-shrink: 0;
  }

  .items {
    padding: 2px 10px;
  }

  .item-row {
    display: grid;
    grid-template-columns: 1fr 92px 28px;
    gap: 10px;
    align-items: center;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .item-row:last-child { border-bottom: none; }

  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] { -moz-appearance: textfield; }

  .item-name {
    border: none;
    background: transparent;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    padding: 4px 0;
    outline: none;
    width: 100%;
  }

  .item-name::placeholder, .item-note::placeholder {
    color: var(--muted);
    opacity: 0.7;
  }

  .item-note {
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--muted);
    padding: 1px 0 0;
    outline: none;
    width: 100%;
  }

  .item-cost {
    border: none;
    background: transparent;
    font-size: 16px;
    text-align: right;
    color: var(--ink);
    padding: 4px 0;
    outline: none;
    width: 100%;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }

  .item-remove {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 6px;
    justify-self: center;
  }

  .add-item-btn {
    display: block;
    width: 100%;
    background: none;
    border: none;
    border-top: 1px dashed var(--line);
    color: var(--blue);
    font-size: 14px;
    font-weight: 500;
    padding: 14px 4px;
    text-align: left;
    cursor: pointer;
  }

  .cat-subtotal {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 13px 16px;
    background: var(--blue-tint-soft);
    font-size: 17px;
    color: var(--blue);
    font-weight: 600;
  }
  .cat-subtotal span:first-child {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .cat-subtotal span:last-child {
    font-variant-numeric: tabular-nums;
  }

  .add-category-btn {
    display: block;
    width: 100%;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 14px;
    color: var(--blue);
    font-size: 15px;
    font-weight: 500;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 22px;
  }

  .total-banner {
    background: var(--pink-tint);
    border: 1px solid var(--pink-border);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .total-label {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--pink);
  }

  .total-value {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--pink);
    font-variant-numeric: tabular-nums;
  }

  .status {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    min-height: 16px;
  }

  .empty-hint {
    font-size: 13px;
    color: var(--muted);
    padding: 14px 16px;
  }

  @media (max-width: 420px) {
    .trip-name-input { font-size: 24px; }
    .item-row { grid-template-columns: 1fr 80px 24px; gap: 8px; }
    .total-value { font-size: 22px; }
    .cat-subtotal { font-size: 16px; }
  }

  .print-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: transparent;
    border: 1px solid var(--blue);
    color: var(--blue);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    padding: 13px;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .print-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px 22px;
    max-width: 300px;
    width: 100%;
    text-align: center;
  }
  .modal-text {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 500;
    margin: 0 0 20px;
    color: var(--ink);
  }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .modal-btn.back {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }
  .modal-btn.delete {
    background: var(--pink-border);
    color: #fff;
    border: none;
  }

  @media print {
    body { background: #fff !important; color: #111 !important; }
    .print-btn, .add-item-btn, .add-category-btn, .item-remove, .cat-remove, .status, .modal-overlay {
      display: none !important;
    }
    .wrap { padding: 0; max-width: 100%; }
    .eyebrow { color: #555 !important; }
    .trip-name-input, .cat-name-input, .item-name, .item-cost, .trip-subtitle-input, .item-note {
      color: #111 !important;
    }
    .category {
      background: #fff !important;
      border: 1px solid #ccc !important;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .category-head { background: #eee !important; }
    .cat-subtotal { background: #f5f5f5 !important; color: #111 !important; }
    .cat-subtotal span:first-child { color: #555 !important; }
    .total-banner { background: #fff !important; border: 1px solid #999 !important; }
    .total-label, .total-value { color: #111 !important; }
    .item-row { border-bottom: 1px solid #ddd !important; }
  }

  body.pdf-export { background: #fff !important; color: #111 !important; }
  body.pdf-export .print-btn,
  body.pdf-export .add-item-btn,
  body.pdf-export .add-category-btn,
  body.pdf-export .item-remove,
  body.pdf-export .cat-remove,
  body.pdf-export .status {
    display: none !important;
  }
  body.pdf-export .eyebrow { color: #555 !important; }
  body.pdf-export .trip-name-input,
  body.pdf-export .cat-name-input,
  body.pdf-export .item-name,
  body.pdf-export .item-cost,
  body.pdf-export .trip-subtitle-input,
  body.pdf-export .item-note {
    color: #111 !important;
  }
  body.pdf-export .category {
    background: #fff !important;
    border: 1px solid #ccc !important;
  }
  body.pdf-export .category-head { background: #eee !important; }
  body.pdf-export .cat-subtotal { background: #f5f5f5 !important; color: #111 !important; }
  body.pdf-export .cat-subtotal span:first-child { color: #555 !important; }
  body.pdf-export .total-banner { background: #fff !important; border: 1px solid #999 !important; }
  body.pdf-export .total-label, body.pdf-export .total-value { color: #111 !important; }
  body.pdf-export .item-row { border-bottom: 1px solid #ddd !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Faisal_Faria_Forever</p>
    <input class="trip-name-input" id="tripName" value="Our Honeymoon in Cox's Bazar" />
    <input class="trip-subtitle-input" id="tripSubtitle" placeholder="Add trip dates or a short note (optional)" />
  </header>

  <button class="print-btn" id="printBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
    Print / Save as PDF
  </button>

  <div id="categories"></div>

  <button class="add-category-btn" id="addCategoryBtn">+ Add category</button>

  <div class="total-banner">
    <span class="total-label">Total cost</span>
    <span class="total-value" id="grandTotal">TK 0</span>
  </div>

  <p class="status" id="statusMsg"></p>
</div>

<div class="modal-overlay" id="confirmOverlay">
  <div class="modal-card">
    <p class="modal-text">Are you sure?</p>
    <div class="modal-actions">
      <button class="modal-btn back" id="modalBack">Back</button>
      <button class="modal-btn delete" id="modalDelete">Delete</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'trip-budget-data';
const CURRENCY = 'TK';

const defaultData = {
  tripName: "Our Honeymoon in Cox's Bazar",
  subtitle: "24-27 Sep, 2026",
  categories: [
    {
      id: 'cat1',
      name: 'Hotel',
      items: [
        { id: 'i1', name: 'Sea Pearl, Inani', note: '24-26 Sep, 2 nights', cost: 16000 },
        { id: 'i2', name: 'Sayeman Heritage, Jhawtola', note: '26-27 Sep, 1 night', cost: 4800 }
      ]
    },
    {
      id: 'cat2',
      name: 'Train',
      items: [
        { id: 'i3', name: "Cox's Bazar Express (Snigdha)", note: '24 Sep, 11:00 PM', cost: 3300 },
        { id: 'i4', name: "Cox's Bazar Express (Snigdha)", note: '27 Sep, 11:00 PM', cost: 3300 }
      ]
    },
    {
      id: 'cat3',
      name: 'Others',
      items: [
        { id: 'i5', name: 'City tour, photograph, horse ride, quad bike', note: '', cost: 2500 },
        { id: 'i6', name: 'Food', note: '', cost: 4500 }
      ]
    }
  ]
};

let data = null;
let saveTimer = null;
let pendingDeleteAction = null;

function uid() {
  return 'x' + Math.random().toString(36).slice(2, 9);
}

const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function storageGet(key) {
  if (hasClaudeStorage) {
    return await window.storage.get(key);
  }
  const raw = window.localStorage.getItem(key);
  if (raw === null) throw new Error('not found');
  return { value: raw };
}

async function storageSet(key, value) {
  if (hasClaudeStorage) {
    return await window.storage.set(key, value);
  }
  window.localStorage.setItem(key, value);
  return true;
}

function normalizeData(raw) {
  return {
    tripName: raw.tripName || defaultData.tripName,
    subtitle: raw.subtitle || '',
    categories: (raw.categories || []).map(cat => ({
      id: cat.id || uid(),
      name: cat.name || '',
      items: (cat.items || []).map(it => ({
        id: it.id || uid(),
        name: it.name || '',
        note: it.note || '',
        cost: Number(it.cost) || 0
      }))
    }))
  };
}

async function loadData() {
  try {
    const result = await storageGet(STORAGE_KEY);
    const parsed = JSON.parse(result.value);
    data = normalizeData(parsed);
  } catch (e) {
    data = normalizeData(defaultData);
  }
  render();
}

function scheduleSave() {
  const statusEl = document.getElementById('statusMsg');
  statusEl.textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await storageSet(STORAGE_KEY, JSON.stringify(data));
      statusEl.textContent = 'Saved';
      setTimeout(() => { if (statusEl.textContent === 'Saved') statusEl.textContent = ''; }, 1500);
    } catch (e) {
      statusEl.textContent = "Couldn't save — changes may be lost.";
    }
  }, 400);
}

function money(n) {
  const rounded = Math.round((n + Number.EPSILON) * 100) / 100;
  return rounded.toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function categoryTotal(cat) {
  return cat.items.reduce((sum, it) => sum + (Number(it.cost) || 0), 0);
}

function grandTotalValue() {
  return data.categories.reduce((sum, cat) => sum + categoryTotal(cat), 0);
}

function render() {
  document.getElementById('tripName').value = data.tripName;
  document.getElementById('tripSubtitle').value = data.subtitle || '';

  const container = document.getElementById('categories');
  container.innerHTML = '';

  data.categories.forEach(cat => {
    const catEl = document.createElement('div');
    catEl.className = 'category';

    const head = document.createElement('div');
    head.className = 'category-head';
    head.innerHTML = `
      <input class="cat-name-input" data-cat="${cat.id}" value="${escapeAttr(cat.name)}" />
      <button class="cat-remove" data-remove-cat="${cat.id}" aria-label="Remove category">&times;</button>
    `;
    catEl.appendChild(head);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'items';

    if (cat.items.length === 0) {
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'No items yet.';
      itemsWrap.appendChild(hint);
    }

    cat.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div>
          <input class="item-name" data-cat="${cat.id}" data-item="${item.id}" data-field="name" value="${escapeAttr(item.name)}" placeholder="Item name" />
          <input class="item-note" data-cat="${cat.id}" data-item="${item.id}" data-field="note" value="${escapeAttr(item.note || '')}" placeholder="Note (optional)" />
        </div>
        <input class="item-cost" type="number" inputmode="decimal" data-cat="${cat.id}" data-item="${item.id}" data-field="cost" value="${item.cost}" placeholder="0" />
        <button class="item-remove" data-remove-item="${cat.id}|${item.id}" aria-label="Remove item">&times;</button>
      `;
      itemsWrap.appendChild(row);
    });

    catEl.appendChild(itemsWrap);

    const addBtn = document.createElement('button');
    addBtn.className = 'add-item-btn';
    addBtn.textContent = '+ Add item';
    addBtn.dataset.addItem = cat.id;
    catEl.appendChild(addBtn);

    const subtotal = document.createElement('div');
    subtotal.className = 'cat-subtotal';
    subtotal.innerHTML = `<span>Subtotal</span><span>${CURRENCY} ${money(categoryTotal(cat))}</span>`;
    catEl.appendChild(subtotal);

    container.appendChild(catEl);
  });

  document.getElementById('grandTotal').textContent = `${CURRENCY} ${money(grandTotalValue())}`;

  attachListeners();
}

function escapeAttr(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function showConfirm(action) {
  pendingDeleteAction = action;
  document.getElementById('confirmOverlay').classList.add('open');
}

function hideConfirm() {
  pendingDeleteAction = null;
  document.getElementById('confirmOverlay').classList.remove('open');
}

function attachListeners() {
  document.querySelectorAll('.cat-name-input').forEach(el => {
    el.oninput = () => {
      const cat = data.categories.find(c => c.id === el.dataset.cat);
      if (cat) { cat.name = el.value; scheduleSave(); updateSubtotalsOnly(); }
    };
  });

  document.querySelectorAll('.cat-remove').forEach(el => {
    el.onclick = () => {
      showConfirm(() => {
        data.categories = data.categories.filter(c => c.id !== el.dataset.removeCat);
        scheduleSave();
        render();
      });
    };
  });

  document.querySelectorAll('.item-name, .item-note, .item-cost').forEach(el => {
    el.oninput = () => {
      const cat = data.categories.find(c => c.id === el.dataset.cat);
      if (!cat) return;
      const item = cat.items.find(i => i.id === el.dataset.item);
      if (!item) return;
      const field = el.dataset.field;
      item[field] = field === 'cost' ? (parseFloat(el.value) || 0) : el.value;
      scheduleSave();
      if (field === 'cost') updateSubtotalsOnly();
    };
  });

  document.querySelectorAll('.item-cost').forEach(el => {
    el.onfocus = () => el.select();
  });

  document.querySelectorAll('[data-remove-item]').forEach(el => {
    el.onclick = () => {
      showConfirm(() => {
        const [catId, itemId] = el.dataset.removeItem.split('|');
        const cat = data.categories.find(c => c.id === catId);
        if (cat) cat.items = cat.items.filter(i => i.id !== itemId);
        scheduleSave();
        render();
      });
    };
  });

  document.querySelectorAll('[data-add-item]').forEach(el => {
    el.onclick = () => {
      const cat = data.categories.find(c => c.id === el.dataset.addItem);
      if (cat) cat.items.push({ id: uid(), name: '', note: '', cost: 0 });
      scheduleSave();
      render();
      const inputs = document.querySelectorAll(`.item-name[data-cat="${el.dataset.addItem}"]`);
      if (inputs.length) inputs[inputs.length - 1].focus();
    };
  });
}

function updateSubtotalsOnly() {
  document.querySelectorAll('.category').forEach((catEl, idx) => {
    const cat = data.categories[idx];
    if (!cat) return;
    const subtotalEl = catEl.querySelector('.cat-subtotal span:last-child');
    if (subtotalEl) subtotalEl.textContent = `${CURRENCY} ${money(categoryTotal(cat))}`;
  });
  document.getElementById('grandTotal').textContent = `${CURRENCY} ${money(grandTotalValue())}`;
}

document.getElementById('tripName').oninput = (e) => {
  data.tripName = e.target.value;
  scheduleSave();
};

document.getElementById('tripSubtitle').oninput = (e) => {
  data.subtitle = e.target.value;
  scheduleSave();
};

document.getElementById('addCategoryBtn').onclick = () => {
  data.categories.push({ id: uid(), name: 'New category', items: [] });
  scheduleSave();
  render();
  const newInputs = document.querySelectorAll('.cat-name-input');
  if (newInputs.length) {
    const last = newInputs[newInputs.length - 1];
    last.focus();
    last.select();
  }
};

document.getElementById('modalBack').onclick = hideConfirm;
document.getElementById('modalDelete').onclick = () => {
  if (pendingDeleteAction) pendingDeleteAction();
  hideConfirm();
};
document.getElementById('confirmOverlay').onclick = (e) => {
  if (e.target.id === 'confirmOverlay') hideConfirm();
};

document.getElementById('printBtn').onclick = async () => {
  const btn = document.getElementById('printBtn');
  const originalLabel = btn.innerHTML;
  const filename = (data.tripName || 'Trip Budget').trim().replace(/[^\w\- ]/g, '') + '.pdf';

  if (typeof html2pdf === 'undefined') {
    window.print();
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Generating PDF…';
  document.body.classList.add('pdf-export');

  try {
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }
  } catch (e) { /* ignore font-load check failures */ }

  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

  html2pdf()
    .set({
      margin: 10,
      filename: filename,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css'] }
    })
    .from(document.querySelector('.wrap'))
    .save()
    .catch(() => { window.print(); })
    .finally(() => {
      document.body.classList.remove('pdf-export');
      btn.disabled = false;
      btn.innerHTML = originalLabel;
    });
};

loadData();
</script>
</body>
</html>
